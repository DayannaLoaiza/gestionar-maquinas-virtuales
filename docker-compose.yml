# PostgreSQL para desarrollo local. Credenciales solo de desarrollo: en otro entorno se
# definen con variables y nunca se commitean (C12).
#
# Puerto 5433 en el host para no chocar con un PostgreSQL instalado localmente en el 5432.
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vm_dev}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea también la base de los tests e2e (`vm_test`) la primera vez que arranca el volumen.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
